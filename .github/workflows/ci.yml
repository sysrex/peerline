name: CI

on:
  push:
    branches: [ main ]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Use PR head SHA on pull_request, otherwise GITHUB_SHA (which is the merge ref on PRs)
  GIT_SHA: ${{ github.event.pull_request.head.sha || github.sha }}

jobs:
  test:
    name: Build and Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Check out code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0
      
    - name: Set up Go
      uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
      with:
        go-version-file: go.mod

    - name: Check formatting
      run: |
        if [ -n "$(gofmt -l .)" ]; then
          echo "Go files are not formatted. Run 'gofmt -w .'"
          gofmt -l .
          exit 1
        fi

    - name: Build with version info
      run: |
        # Use exact tag match or 'dev' (avoid git describe suffixes that leak commit in minimal mode)
        VERSION="$(git describe --tags --exact-match 2>/dev/null || echo dev)"
        COMMIT="${GIT_SHA}"
        BUILD_TIME="$(git show -s --format=%cI ${GIT_SHA} 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ)"
        
        echo "Building with VERSION=${VERSION} COMMIT=${COMMIT} BUILD_TIME=${BUILD_TIME}"
        
        # Validate values (reject spaces, quotes, control chars)
        for val in "$VERSION" "$COMMIT" "$BUILD_TIME"; do
          case "$val" in
            *[!A-Za-z0-9._+:-]*)
              echo "ERROR: Invalid build value contains forbidden characters: $val" >&2
              exit 1
              ;;
          esac
        done
        
        go build -ldflags="-X github.com/sysrex/peerline/internal/version.Version=${VERSION} \
          -X github.com/sysrex/peerline/internal/version.Commit=${COMMIT} \
          -X github.com/sysrex/peerline/internal/version.BuildTime=${BUILD_TIME}" \
          -o "$RUNNER_TEMP/peerline" ./cmd/peerline

    - name: Verify version output
      run: |
        VERSION_OUTPUT="$("$RUNNER_TEMP/peerline" -version)"
        echo "Version output: $VERSION_OUTPUT"
        # Verify it contains the commit SHA
        if ! echo "$VERSION_OUTPUT" | grep -q "${GIT_SHA}"; then
          echo "ERROR: Version output does not contain commit SHA ${GIT_SHA}"
          exit 1
        fi

    - name: Vet
      run: go vet ./...

    - name: Test
      run: go test -race -count=1 -timeout 5m ./...

    - name: Integration tests
      run: go test -race -count=1 -timeout 5m -tags integration .

  security:
    name: Security Scan
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Check out code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    
    - name: Set up Go
      uses: actions/setup-go@41dfa10bad2bb2ae585af6ee5bb4d7d973ad74ed # v5.1.0
      with:
        go-version-file: go.mod
        cache: true
    
    - name: Install govulncheck
      run: go install golang.org/x/vuln/cmd/govulncheck@latest
    
    - name: Run govulncheck
      run: govulncheck ./...

  docker:
    name: Docker Build
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Check out code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
    
    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@c47758b77c9736f4b2ef4073d4d51994fabfe349 # v3.7.1
    
    - name: Build Docker image
      uses: docker/build-push-action@48aba3b46d1b1fec4febb7c5d0c644b249a11355 # v6.10.0
      with:
        context: .
        push: false
        tags: peerline:test
        cache-from: type=gha
        cache-to: type=gha,mode=max

  docker-smoke:
    name: Docker Smoke Test
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
    - name: Check out code
      uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      with:
        fetch-depth: 0

    - name: Build Docker image with version info
      run: |
        VERSION="$(git describe --tags --exact-match 2>/dev/null || echo dev)"
        COMMIT="${GIT_SHA}"
        BUILD_TIME="$(git show -s --format=%cI ${GIT_SHA} 2>/dev/null || date -u +%Y-%m-%dT%H:%M:%SZ)"
        
        echo "Building Docker image with VERSION=${VERSION} COMMIT=${COMMIT} BUILD_TIME=${BUILD_TIME}"
        
        docker build \
          --build-arg VERSION="${VERSION}" \
          --build-arg COMMIT="${COMMIT}" \
          --build-arg BUILD_TIME="${BUILD_TIME}" \
          -t peerline:test .

    - name: Smoke test /version endpoint
      run: |
        start() { # name, extra docker args...
          name="$1"; shift
          docker run -d --name "$name" -p 8787:8787 --tmpfs /data \
            -e PEERLINE_ADDR=0.0.0.0:8787 -e PEERLINE_DB=/data/peerline.db "$@" peerline:test
          for i in $(seq 1 30); do
            curl -sf http://localhost:8787/healthz > /dev/null 2>&1 && return 0
            sleep 1
          done
          echo "ERROR: $name did not become ready within 30s"
          docker logs "$name"
          return 1
        }

        start peerline-test
        VERSION_JSON="$(curl -sf http://localhost:8787/version)"
        echo "default: $VERSION_JSON"
        echo "$VERSION_JSON" | grep -q '"version"' || { echo "ERROR: missing 'version'"; exit 1; }
        if echo "$VERSION_JSON" | grep -q '"commit"'; then
          echo "ERROR: default mode must not include 'commit'"
          exit 1
        fi
        docker rm -f peerline-test

        start peerline-off -e PEERLINE_VERSION_DETAIL=off
        CODE="$(curl -s -o /dev/null -w '%{http_code}' http://localhost:8787/version)"
        [ "$CODE" = "404" ] || { echo "ERROR: off mode returned $CODE"; exit 1; }
        docker rm -f peerline-off

        start peerline-full -e PEERLINE_VERSION_DETAIL=full
        FULL_JSON="$(curl -sf http://localhost:8787/version)"
        echo "full: $FULL_JSON"
        echo "$FULL_JSON" | grep -q "\"commit\":\"${GIT_SHA:0:12}\"" || { echo "ERROR: commit not stamped"; exit 1; }
        echo "$FULL_JSON" | grep -q '"build_time":"2' || { echo "ERROR: build_time not stamped"; exit 1; }

    - name: Container logs
      if: always()
      run: |
        for c in peerline-test peerline-off peerline-full; do docker logs "$c" 2>&1 || true; done
        docker rm -f peerline-test peerline-off peerline-full || true

  all-jobs:
    name: All Jobs Ran
    if: always()
    needs: [test, security, docker, docker-smoke]
    runs-on: ubuntu-latest
    timeout-minutes: 2
    steps:
    - name: Require every job to have succeeded
      env:
        RESULTS: ${{ join(needs.*.result, ' ') }}
      run: |
        for r in $RESULTS; do
          [ "$r" = "success" ] || { echo "ERROR: a required job result was '$r'"; exit 1; }
        done
